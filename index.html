
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffb6d9">
<title>MyAI 💗</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff0f7,#ffe0ef);color:#713b58}
main{max-width:650px;margin:auto}
h1{text-align:center;color:#e65b9c;font-size:34px}
.sottotitolo{text-align:center;margin-bottom:24px}
.card{background:#ffffffd9;padding:20px;border-radius:22px;margin:18px 0;box-shadow:0 5px 18px #e99abd30}
h2{color:#df5c9c;margin-top:0}
textarea{width:100%;min-height:110px;border:2px solid #f4b5d2;border-radius:14px;padding:12px;font:16px Arial;resize:vertical;background:#fffafd;color:#713b58}
button{border:0;border-radius:14px;padding:12px 18px;margin-top:10px;background:#e968a6;color:white;font-size:15px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.6}
.risposta{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff5fa;border-radius:14px;padding:14px;min-height:45px;line-height:1.5}
.piccolo{font-size:12px;color:#956b82}
label{display:block;margin:10px 0 5px}
input[type=range]{width:100%;accent-color:#e968a6}
img{display:block;max-width:100%;border-radius:16px;margin-top:14px}
footer{text-align:center;font-size:12px;padding:15px;color:#a66e8a}
</style>
</head>
<body>
<main>
<h1>MyAI 💗</h1>
<p class="sottotitolo">La tua intelligenza artificiale personale ✨</p>

<section class="card">
<h2>💬 Chatta con MyAI</h2>
<textarea id="richiesta" placeholder="Scrivi qui quello che vuoi chiedermi..."></textarea>
<button id="invia" onclick="prepara()">Invia messaggio 💗</button>
<div id="risposta" class="risposta">Ciao! Sono MyAI 💗 Scrivimi qualcosa!</div>
<p class="piccolo">MyAI può commettere errori: verifica le informazioni importanti.</p>
</section>

<section class="card">
<h2>🎀 Modifica una foto</h2>
<p>Seleziona una foto e prova i filtri rosa.</p>
<input type="file" id="fileFoto" accept="image/*">
<label for="lum">Luminosità</label>
<input type="range" id="lum" min="50" max="150" value="100">
<label for="rosa">Effetto rosa</label>
<input type="range" id="rosa" min="0" max="100" value="0">
<img id="anteprima" alt="Anteprima della foto" style="display:none">
<button onclick="scaricaFoto()">Scarica foto 💗</button>
</section>

<footer>MyAI 💗 La tua piccola assistente personale</footer>
</main>

<script>
const API_URL = 'https://myai-motore.giulia-eleuteri05.workers.dev/';

async function prepara(){
  const campo = document.getElementById('richiesta');
  const risposta = document.getElementById('risposta');
  const pulsante = document.getElementById('invia');
  const messaggio = campo.value.trim();

  if(!messaggio){
    risposta.textContent = 'Scrivi prima un messaggio 💗';
    return;
  }

  pulsante.disabled = true;
  risposta.textContent = 'MyAI sta pensando... 💗';

  try{
    const res = await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({message:messaggio})
    });

    const data = await res.json();

    if(!res.ok || data.error){
      throw new Error(data.error || 'Errore del server');
    }

    risposta.textContent = data.reply || 'Non ho ricevuto una risposta 💗';
  }catch(error){
    risposta.textContent = 'Ops! Non riesco a collegarmi a MyAI. Controlla la connessione e riprova. 💗';
    console.error(error);
  }finally{
    pulsante.disabled = false;
  }
}

const fileFoto = document.getElementById('fileFoto');
const anteprima = document.getElementById('anteprima');
let immagineOriginale = null;

fileFoto.addEventListener('change',function(){
  const file = this.files[0];
  if(!file) return;

  const url = URL.createObjectURL(file);
  const img = new Image();

  img.onload = function(){
    immagineOriginale = img;
    anteprima.src = url;
    anteprima.style.display = 'block';
    aggiornaFiltri();
  };

  img.src = url;
});

function aggiornaFiltri(){
  const luminosita = document.getElementById('lum').value;
  const rosa = document.getElementById('rosa').value;
  anteprima.style.filter = 'brightness('+luminosita+'%) sepia('+(rosa/2)+'%) saturate('+(100+rosa)+'%) hue-rotate('+(320+rosa/5)+'deg)';
}

document.getElementById('lum').addEventListener('input',aggiornaFiltri);
document.getElementById('rosa').addEventListener('input',aggiornaFiltri);

function scaricaFoto(){
  if(!immagineOriginale){
    alert('Seleziona prima una foto 💗');
    return;
  }

  const canvas = document.createElement('canvas');
  canvas.width = immagineOriginale.naturalWidth;
  canvas.height = immagineOriginale.naturalHeight;

  const ctx = canvas.getContext('2d');
  const luminosita = document.getElementById('lum').value;
  const rosa = document.getElementById('rosa').value;

  ctx.filter = 'brightness('+luminosita+'%) sepia('+(rosa/2)+'%) saturate('+(100+rosa)+'%) hue-rotate('+(320+rosa/5)+'deg)';
  ctx.drawImage(immagineOriginale,0,0);

  const link = document.createElement('a');
  link.download = 'MyAI-foto.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>
</body>
</html>
